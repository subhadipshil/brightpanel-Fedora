<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Monitor Gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#353b45"/>
      <stop offset="100%" stop-color="#1e2229"/>
    </linearGradient>

    <!-- Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a202c"/>
      <stop offset="50%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#171923"/>
    </linearGradient>

    <!-- Glowing Sun / Brightness Dial Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdd53"/>
      <stop offset="60%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#f56565"/>
    </linearGradient>

    <!-- Fedora Blue Accent Ring -->
    <linearGradient id="fedoraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#51a2da"/>
      <stop offset="100%" stop-color="#294172"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Monitor Stand Base -->
  <path d="M44 116 L84 116 C86 116 88 114 87 112 L82 104 L46 104 L41 112 C40 114 42 116 44 116 Z" fill="#2d3748"/>
  <!-- Stand Neck -->
  <rect x="58" y="88" width="12" height="18" rx="2" fill="#4a5568"/>

  <!-- Monitor Body Bezel -->
  <rect x="12" y="14" width="104" height="76" rx="8" fill="url(#bodyGrad)" stroke="#4a5568" stroke-width="2"/>

  <!-- Screen Area -->
  <rect x="18" y="20" width="92" height="64" rx="4" fill="url(#screenGrad)"/>

  <!-- Sun Rays (Glowing) -->
  <g stroke="url(#sunGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <line x1="64" y1="30" x2="64" y2="35"/>
    <line x1="64" y1="69" x2="64" y2="74"/>
    <line x1="42" y1="52" x2="47" y2="52"/>
    <line x1="81" y1="52" x2="86" y2="52"/>
    <line x1="48.4" y1="36.4" x2="52" y2="40"/>
    <line x1="76" y1="64" x2="79.6" y2="67.6"/>
    <line x1="48.4" y1="67.6" x2="52" y2="64"/>
    <line x1="76" y1="40" x2="79.6" y2="36.4"/>
  </g>

  <!-- Center Sun Sphere -->
  <circle cx="64" cy="52" r="11" fill="url(#sunGrad)" filter="url(#glow)"/>
  <circle cx="64" cy="52" r="8" fill="#fff" opacity="0.4"/>

  <!-- Lower Panel Slider Bar Graphic -->
  <rect x="34" y="70" width="60" height="4" rx="2" fill="#4a5568"/>
  <rect x="34" y="70" width="45" height="4" rx="2" fill="url(#fedoraGrad)"/>
  <circle cx="79" cy="72" r="4.5" fill="#51a2da" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Power Status Indicator Dot -->
  <circle cx="64" cy="85.5" r="1.5" fill="#48bb78"/>
</svg>
